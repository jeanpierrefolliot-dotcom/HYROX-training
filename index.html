<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#111827;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}
.wrap{max-width:760px;margin:auto}.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}.title{font-size:25px;font-weight:800;margin:4px 0}.sub{opacity:.75;font-size:14px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.controls button,.controls input{width:100%;border:0;border-radius:12px;padding:12px;font-size:15px}
button{cursor:pointer}.controls button{background:#374151;color:white;font-weight:700}.controls input{background:white;color:#111827}
main{padding:18px}.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #0000000d}.date{font-size:14px;color:#6b7280;font-weight:700}.session-title{font-size:24px;font-weight:850;margin:5px 0 14px}.progressbar{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progressbar>div{height:100%;background:#111827;width:0;transition:.25s}.progressline{display:flex;justify-content:space-between;margin:8px 0 16px;font-size:13px;color:#6b7280}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid #eef0f2}.item:first-child{border-top:0}.item input{width:22px;height:22px;accent-color:#111827;flex:none;margin-top:1px}.item.done .txt{text-decoration:line-through;color:#9ca3af}.txt{font-size:16px;line-height:1.38}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav button{padding:13px;border:0;border-radius:12px;background:#e5e7eb;font-weight:700}.nav button.primary{background:#111827;color:white}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:9px 3px;border:0;border-radius:10px;background:#f3f4f6;font-size:12px;font-weight:700}.day.active{background:#111827;color:white}.day.done{outline:2px solid #9ca3af}.hint{font-size:13px;color:#6b7280;line-height:1.45}.footer{text-align:center;color:#9ca3af;font-size:12px;padding:5px 0 25px}
@media(min-width:650px){main{padding:24px}.controls{grid-template-columns:160px 1fr 160px}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="brand">HYROX DOUBLES · 06/10 → 15/12/2026</div>
<div class="title">Mon entraînement</div><div class="sub">Ta séance du jour, exercice par exercice.</div>
<div class="controls"><button id="todayBtn">Aujourd’hui</button><input id="datePicker" type="date"><button id="resetBtn">Réinitialiser la séance</button></div>
</div></header>
<main class="wrap">
<section class="card">
<div class="date" id="phase"></div><div class="session-title" id="sessionTitle"></div>
<div class="progressline"><span id="count">0 / 0 terminé</span><span id="percent">0%</span></div>
<div class="progressbar"><div id="bar"></div></div>
<div id="items"></div>
</section>
<section class="card"><div class="date">NAVIGATION RAPIDE</div><div class="hint" style="margin:6px 0 12px">Choisis une date pour afficher sa séance.</div><div class="calendar" id="calendar"></div></section>
<section class="nav"><button id="prev">← Jour précédent</button><button id="next" class="primary">Jour suivant →</button></section>
<div class="footer">Les cases cochées sont sauvegardées sur cet appareil.</div>
</main>
<script>
const DATA = [{"date": "2026-10-06", "title": "HAUT DU CORPS + COURSE", "items": ["Échauffement 8 min tapis 5'30/km · Mobilité épaules/hanches · 2×10 air squats · 2×10 pompes", "Développé couché 4 × 6 — 60 kg", "Tractions 4 × 6 — poids du corps", "Développé incliné 3 × 8 — 22 kg/haltère", "Tirage horizontal 3 × 10 — 55 kg", "Développé épaules 3 × 8 — 30 kg", "Gainage 3 × 45 s", "Course 20 min — 5'00–5'20/km"]}, {"date": "2026-10-07", "title": "INTERVALLES + JAMBES", "items": ["Course 15 min échauffement · 5 × 800 m en 3'30–3'35 · récup 1'30 · 10 min retour au calme", "Squat 4 × 6 — 70 kg", "RDL 3 × 8 — 60 kg", "Bulgarian split 3 × 8/jambe — 16 kg/haltère", "Leg curl 3 × 12 — 40 kg", "Mollets 3 × 15"]}, {"date": "2026-10-08", "title": "INITIATION HYROX", "items": ["3 tours · récup 2 min", "Tour : 1 000 m course 4'35–4'45 · SkiErg 500 m · 10 burpees · 20 wall balls 6 kg · 20 walking lunges PDC", "Fin 10 min rameur tranquille"]}, {"date": "2026-10-09", "title": "RÉCUPÉRATION", "items": ["Course facile 5'10–5'30/km", "Mobilité 10 min"]}, {"date": "2026-10-10", "title": "HAUT DU CORPS", "items": ["Développé couché 4 × 6 — 62,5 kg", "Tractions 4 × 6", "Rowing 4 × 8 — 55–60 kg", "Développé incliné 3 × 10 — 20–22 kg", "Élévations latérales 3 × 15", "Curl biceps 3 × 10", "Extension triceps 3 × 12", "Gainage 3 × 1 min", "Course 15 min footing facile"]}, {"date": "2026-10-11", "title": "JAMBES + SLED", "items": ["Squat 4 × 6 — 70–75 kg", "RDL 4 × 8 — 60 kg", "Presse 3 × 10 — 140 kg", "Leg curl 3 × 12", "Sled push 4 × 12,5 m — 100–110 kg", "Sled pull 4 × 12,5 m — 70–80 kg", "Wall balls 4 × 15 — 6 kg"]}, {"date": "2026-10-12", "title": "ENDURANCE", "items": ["Course 5'00–5'20/km · puis 6 × 20 s accélération · récup 1 min"]}, {"date": "2026-10-13", "title": "PREMIER COMBO HYROX", "items": ["4 tours · récup 2 min", "Tour : 1 km 4'30–4'35 · Sled push 12,5 m 110 kg · Sled pull 12,5 m 80 kg · 15 wall balls 6 kg · 10 burpees", "Fin Row 1 000 m allure régulière"]}, {"date": "2026-10-14 28", "title": "HAUT + ROW", "items": ["Développé couché 4 × 5 — 67,5 kg", "Tractions 4 × 6", "Rowing 3 × 8 — 60 kg", "Incliné 3 × 8", "Épaules 3 × 8", "Row 4 × 500 m · récup 90 s"]}, {"date": "2026-10-29", "title": "FOOTING", "items": ["Course 40 min facile + 6 × 20 s accélérations"]}, {"date": "2026-10-30", "title": "8 × 500 M", "items": ["Course 8 × 500 m 1'58–2'05 · récup 1 min"]}, {"date": "2026-10-31", "title": "GROSSE SÉANCE SPÉCIFIQUE", "items": ["6 tours", "Tour : 1 km 4'25–4'35 · 12,5 m sled push · 12,5 m sled pull · 15 wall balls · 10 burpees"]}, {"date": "2026-11-01", "title": "REPOS COMPLET", "items": ["Repos total"]}, {"date": "2026-11-02", "title": "HAUT DU CORPS", "items": ["Développé couché 4 × 5 — 67,5 kg", "Tractions 4 × 6", "Rowing 4 × 8 — 60 kg", "Incliné 3 × 8", "Épaules 3 × 8", "Gainage 3 × 1 min"]}, {"date": "2026-11-03", "title": "FOOTING", "items": ["Course 40 min footing + 6 × 20 s"]}, {"date": "2026-11-04", "title": "4 × 1 500 M", "items": ["Course 4 × 1 500 m 4'25–4'35/km · récup 2 min"]}, {"date": "2026-11-05", "title": "STATIONS", "items": ["Ski 1 000 m", "Sled push 4 × 12,5 m — 140 kg", "Sled pull 4 × 12,5 m — 95 kg", "Burpees 80 m", "Row 1 000 m", "Farmers 200 m — 2 × 24 kg", "Lunges 50 m — 20 kg", "Wall balls 50 — 6 kg"]}, {"date": "2026-11-06", "title": "REPOS", "items": ["Repos"]}, {"date": "2026-11-07", "title": "JAMBES", "items": ["Squat 4 × 5 — 80 kg", "RDL 4 × 6 — 70 kg", "Presse 3 × 8 — 160 kg", "Bulgarian 3 × 8", "Sled push 4 × 12,5 m — 140–152 kg", "Sled pull 4 × 12,5 m — 95–103 kg"]}, {"date": "2026-11-08", "title": "ENDURANCE", "items": ["Course 70 min — 5'00–5'20/km"]}, {"date": "2026-11-09", "title": "COMBO", "items": ["6 tours", "Tour 1 km 4'25–4'35 + station", "Stations : 1. Ski 500 m · 2. Push 25 m · 3. Pull 25 m · 4. 40 m burpees · 5. Row 500 m · 6. Farmers 100 m"]}, {"date": "2026-11-10", "title": "REPOS", "items": ["Repos"]}, {"date": "2026-11-11", "title": "HAUT DU CORPS + SKI/ROW", "items": ["Développé couché 4 × 5", "Tractions 4 × 6", "Rowing 3 × 10", "Shoulder press 3 × 8", "Ski 4 × 250 m", "Row 4 × 250 m"]}, {"date": "2026-11-12", "title": "FOOTING", "items": ["Course 45 min footing facile"]}, {"date": "2026-11-13", "title": "6 × 1 KM", "items": ["Course 6 × 1 km 4'20–4'30 · récup 90 s"]}, {"date": "2026-11-14", "title": "SIMULATION 1 · PARTENAIRE · CHARGES COMPÉTITION", "items": ["1 km + Ski 1 000 m", "1 km + Sled Push 50 m", "1 km + Sled Pull 50 m", "1 km + Burpees 80 m", "1 km + Row 1 000 m", "1 km + Farmers 200 m", "1 km + Lunges 100 m"]}, {"date": "2026-11-15", "title": "REPOS TOTAL", "items": ["Repos total"]}, {"date": "2026-11-16", "title": "HAUT DU CORPS", "items": ["Contenu 50 min haut du corps"]}, {"date": "2026-11-17", "title": "FOOTING", "items": ["Course 35 min footing facile"]}, {"date": "2026-11-18", "title": "5 × 1 KM", "items": ["Course 5 × 1 km 4'20–4'30 · récup 90 s"]}, {"date": "2026-11-19", "title": "SIMULATION 2 · CHARGES OFFICIELLES", "items": ["1 km → Ski 1 000 m", "1 km → Push 50 m", "1 km → Pull 50 m", "1 km → Burpees 80 m", "1 km → Row 1 000 m", "1 km → Farmers 200 m", "1 km → Lunges 100 m", "1 km → Wall Balls 100"]}, {"date": "2026-11-20", "title": "REPOS COMPLET", "items": ["Repos total"]}, {"date": "2026-11-21", "title": "JAMBES + SLED", "items": ["Squat 4 × 5 — 80 kg", "RDL 3 × 6 — 70 kg", "Presse 3 × 8 — 160 kg", "Sled push 4 × 12,5 m — 152 kg", "Sled pull 4 × 12,5 m — 103 kg"]}, {"date": "2026-11-22", "title": "ENDURANCE", "items": ["Course 60 min footing"]}, {"date": "2026-11-23", "title": "HYROX DOUBLES · 8 × 1 KM", "items": ["8 × 1 km 4'25–4'35/km", "1. Ski 750 m", "2. Push 50 m", "3. Pull 50 m", "4. Burpees 60 m", "5. Row 750 m", "6. Farmers 150 m", "7. Lunges 75 m", "8. Wall Balls 75"]}, {"date": "2026-11-24", "title": "REPOS", "items": ["Repos"]}, {"date": "2026-11-25", "title": "HAUT DU CORPS", "items": ["Développé couché 4 × 5 — 67,5–70 kg", "Tractions 4 × 6", "Rowing 4 × 8", "Incliné 3 × 8", "Épaules 3 × 8", "Gainage"]}, {"date": "2026-11-26", "title": "FOOTING", "items": ["Course 40 min facile"]}, {"date": "2026-11-27", "title": "6 × 800 M", "items": ["Course 6 × 800 m 3'25–3'35 · récup 90 s"]}, {"date": "2026-11-28", "title": "SIMULATION 3 · COMPLÈTE PARTENAIRE", "items": ["Course 4'25–4'35/km", "Charges officielles", "Format simulation complète · stratégie relais · transitions rapides"]}, {"date": "2026-11-29", "title": "REPOS COMPLET", "items": ["Repos total"]}, {"date": "2026-11-30", "title": "HAUT DU CORPS LÉGER", "items": ["Développé couché 3 × 5 — 60 kg", "Tractions 3 × 6", "Rowing 3 × 8", "Épaules 3 × 8", "Gainage"]}, {"date": "2026-12-01", "title": "FOOTING", "items": ["Course 40 min footing"]}, {"date": "2026-12-02", "title": "4 × 1 KM", "items": ["Course 4 × 1 km 4'20–4'30 · récup 2 min"]}, {"date": "2026-12-03", "title": "HYROX SPÉCIFIQUE", "items": ["6 tours · intensité 8/10", "Tour : 1 km + station", "Stations : Ski 500 m · Push 25 m · Pull 25 m · Burpees 40 m · Row 500 m · Farmers 100 m"]}, {"date": "2026-12-04", "title": "REPOS", "items": ["Repos"]}, {"date": "2026-12-05", "title": "DERNIER RAPPEL FORCE", "items": ["Squat 3 × 5 — 70 kg", "RDL 3 × 6 — 60 kg", "Sled push 3 × 12,5 m — 152 kg", "Sled pull 3 × 12,5 m — 103 kg", "Farmers 2 × 50 m — 24 kg", "Wall balls 3 × 15 — 6 kg"]}, {"date": "2026-12-06", "title": "ENDURANCE", "items": ["Course 50 min endurance facile + 6 × 20 s"]}, {"date": "2026-12-07", "title": "REPOS COMPLET", "items": ["Repos total"]}, {"date": "2026-12-08", "title": "DERNIÈRE SÉANCE HYROX", "items": ["4 tours · récup 2 min · 45–50 min", "Tour : 1 km 4'25–4'35 · 250 m Ski · 12,5 m Push · 12,5 m Pull · 10 burpees · 15 wall balls"]}, {"date": "2026-12-09", "title": "HAUT DU CORPS TRÈS LÉGER", "items": ["Développé couché 3 × 5 — 55–60 kg", "Tractions 3 × 5", "Rowing 3 × 8", "Épaules 2 × 10", "Gainage 2 × 45 s"]}, {"date": "2026-12-10", "title": "FOOTING", "items": ["Course 30 min 5'00–5'20/km · 4 × 20 s rapides"]}, {"date": "2026-12-11", "title": "REPOS COMPLET", "items": ["Repos total"]}, {"date": "2026-12-12", "title": "ACTIVATION", "items": ["30 min max", "10 min footing · 3 × 400 m allure HYROX · 10 wall balls · 10 squats · 10 pompes · mobilité"]}, {"date": "2026-12-13", "title": "REPOS COMPLET", "items": ["Repos total"]}, {"date": "2026-12-14", "title": "DERNIER RAPPEL", "items": ["25 min footing très facile · 4 × 20 s accélération · 10 air squats · 10 pompes · 10 wall balls"]}, {"date": "2026-12-15", "title": "VEILLE", "items": ["Aucun entraînement"]}];
const KEY="hyrox_doubles_check_v1";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
let selected=new URLSearchParams(location.search).get("date") || new Date().toISOString().slice(0,10);
const byDate=Object.fromEntries(DATA.map(x=>[x.date,x]));
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){
 if(!byDate[selected]){
   selected=DATA[0].date;
 }
 const s=byDate[selected], checks=state[selected]||[];
 document.getElementById("datePicker").value=selected;
 document.getElementById("phase").textContent=fmt(selected).toUpperCase();
 document.getElementById("sessionTitle").textContent=s.title;
 const box=document.getElementById("items"); box.innerHTML="";
 s.items.forEach((x,i)=>{
   const row=document.createElement("label"); row.className="item"+(checks[i]?" done":"");
   row.innerHTML=`<input type="checkbox" ${checks[i]?"checked":""}><span class="txt">${x}</span>`;
   row.querySelector("input").onchange=e=>{checks[i]=e.target.checked;state[selected]=checks;save();render()};
   box.appendChild(row);
 });
 const done=checks.filter(Boolean).length,total=s.items.length,pct=total?Math.round(done/total*100):0;
 document.getElementById("count").textContent=`${done} / ${total} terminé`;
 document.getElementById("percent").textContent=pct+"%"; document.getElementById("bar").style.width=pct+"%";
 renderCalendar();
}
function renderCalendar(){
 const c=document.getElementById("calendar");c.innerHTML="";
 DATA.forEach(s=>{
  const b=document.createElement("button");b.className="day"+(s.date===selected?" active":"");
  const d=new Date(s.date+"T12:00:00");b.textContent=d.getDate()+"/"+(d.getMonth()+1);
  const checks=state[s.date]||[]; if(checks.length&&checks.filter(Boolean).length===s.items.length)b.classList.add("done");
  b.onclick=()=>{selected=s.date;render();window.scrollTo({top:0,behavior:"smooth"})};c.appendChild(b);
 });
}
function move(delta){let i=DATA.findIndex(x=>x.date===selected);i=Math.max(0,Math.min(DATA.length-1,i+delta));selected=DATA[i].date;render();window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("todayBtn").onclick=()=>{const t=new Date().toISOString().slice(0,10);selected=byDate[t]?t:DATA[0].date;render();window.scrollTo({top:0,behavior:"smooth"})};
document.getElementById("datePicker").onchange=e=>{selected=e.target.value;render();window.scrollTo({top:0,behavior:"smooth"})};
document.getElementById("prev").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1);
document.getElementById("resetBtn").onclick=()=>{if(confirm("Réinitialiser les cases de cette séance ?")){delete state[selected];save();render()}};
render();
</script>
